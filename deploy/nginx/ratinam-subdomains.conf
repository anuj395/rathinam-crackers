# /etc/nginx/sites-available/ratinam-subdomains
#
# Production reverse proxy for Rathinam Crackers ERP — subdomain layout.
#
#   rathinamcracker.com / www.   → public storefront (artifacts/website)
#   api.rathinamcracker.com      → Express API on 127.0.0.1:8080
#   erp.rathinamcracker.com      → ERP admin panel (artifacts/erp)
#   pos.rathinamcracker.com      → POS terminal (artifacts/pos)
#   wh.rathinamcracker.com       → Warehouse dashboard (artifacts/warehouse)
#
# Frontends here are built with BASE_PATH="/" (subdomain root) and call the
# API at https://api.rathinamcracker.com/api/... — see /etc/ratinam.env
# (VITE_API_BASE) which the install.sh script wires up at build time.
#
# Issue all certs at once with:
#   sudo certbot --nginx \
#     -d rathinamcracker.com -d www.rathinamcracker.com \
#     -d api.rathinamcracker.com \
#     -d erp.rathinamcracker.com \
#     -d pos.rathinamcracker.com \
#     -d wh.rathinamcracker.com \
#     --redirect --non-interactive --agree-tos -m admin@rathinamcracker.com

# ---------- Rate-limit zones (place inside http{} of nginx.conf if not present) ----------
# limit_req_zone $binary_remote_addr zone=api:10m  rate=200r/m;
# limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

upstream ratinam_api {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ---------- Shared snippet (security headers + gzip) ----------
# Pulled into every server{} block via `include`.
# Saved as /etc/nginx/snippets/ratinam-common.conf by install.sh.
#
#   server_tokens off;
#   add_header X-Frame-Options "SAMEORIGIN" always;
#   add_header X-Content-Type-Options "nosniff" always;
#   add_header Referrer-Policy "strict-origin-when-cross-origin" always;
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#   gzip on; gzip_vary on; gzip_min_length 1024; gzip_proxied any; gzip_comp_level 6;
#   gzip_types text/plain text/css text/xml application/json application/javascript
#              application/xml+rss application/atom+xml image/svg+xml;
#   client_max_body_size 25m;

# ============================================================
# 1. Public website — rathinamcracker.com / www.
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name rathinamcracker.com www.rathinamcracker.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rathinamcracker.com www.rathinamcracker.com;

    ssl_certificate     /etc/letsencrypt/live/rathinamcracker.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rathinamcracker.com/privkey.pem;
    include /etc/nginx/snippets/ratinam-common.conf;

    root /var/www/ratinam/artifacts/website/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

# ============================================================
# 2. API — api.rathinamcracker.com
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name api.rathinamcracker.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.rathinamcracker.com;

    ssl_certificate     /etc/letsencrypt/live/rathinamcracker.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rathinamcracker.com/privkey.pem;
    include /etc/nginx/snippets/ratinam-common.conf;

    # CORS for the four other subdomains.
    add_header Access-Control-Allow-Origin  "$http_origin" always;
    add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization,Content-Type,Idempotency-Key" always;
    add_header Access-Control-Allow-Credentials "true" always;
    if ($request_method = OPTIONS) { return 204; }

    location /uploads/ {
        # Media library files written by the API to UPLOADS_DIR.
        alias /opt/rathinam/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Tighter rate limit on auth endpoints — defends against brute force.
    location ~ ^/api/v1/auth/(login|pin-login)$ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass         http://ratinam_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    location / {
        limit_req zone=api burst=50 nodelay;
        proxy_pass         http://ratinam_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}

