# /etc/nginx/sites-available/ratinam
#
# Production reverse proxy for Rathinam Crackers ERP on AWS EC2.
# Replicates what the Replit shared proxy does for us in development:
# routes path-prefixed traffic to the right upstream service.
#
# Layout (single domain, path-based):
#   /api/      → Express API (PM2, listening on 127.0.0.1:8080)
#   /         → ERP admin panel (static dist)
#   /pos/      → POS interface (static dist)
#   /warehouse/→ Warehouse dashboard (static dist)
#   /website/  → Public storefront (static dist)
#
# If you prefer separate sub-domains (api.example.com, pos.example.com, etc.)
# duplicate this block per host and drop the path prefixes — the API itself
# already mounts everything under /api so no path rewriting is needed either way.

# Rate limit zones (defined at http{} level — put this in /etc/nginx/nginx.conf
# inside http{} if it isn't already, or include it via a shared snippet):
#   limit_req_zone $binary_remote_addr zone=api:10m  rate=200r/m;
#   limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

upstream ratinam_api {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name rathinamcracker.com www.rathinamcracker.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rathinamcracker.com www.rathinamcracker.com;

    # Certbot-managed certificate (run `certbot --nginx -d rathinamcracker.com`)
    ssl_certificate     /etc/letsencrypt/live/rathinamcracker.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rathinamcracker.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    client_max_body_size 25m;   # Excel uploads + PDFs

    # ---------- API ----------
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass         http://ratinam_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
    # Tighter rate limit on auth endpoints
    location ~ ^/api/v1/auth/(login|pin-login)$ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass         http://ratinam_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---------- Static SPAs (each artifact builds to dist/) ----------
    # Long cache for hashed assets, short cache for index.html
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        root /var/www/ratinam;          # base path; try_files below picks the artifact
        try_files /artifacts/erp/dist$uri
                  /artifacts/pos/dist$uri
                  /artifacts/warehouse/dist$uri
                  /artifacts/website/dist$uri
                  =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /pos/ {
        alias /var/www/ratinam/artifacts/pos/dist/;
        try_files $uri $uri/ /pos/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location /warehouse/ {
        alias /var/www/ratinam/artifacts/warehouse/dist/;
        try_files $uri $uri/ /warehouse/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location /website/ {
        alias /var/www/ratinam/artifacts/website/dist/;
        try_files $uri $uri/ /website/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    # ERP at root
    location / {
        root /var/www/ratinam/artifacts/erp/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
