components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuditLogEntry:
      type: object
      properties:
        id: { type: string }
        actorUserId: { type: string, nullable: true }
        actorRole: { type: string, nullable: true }
        actorName: { type: string, nullable: true }
        action:
          type: string
          enum: [CREATE, UPDATE, DELETE]
        entityType: { type: string }
        entityId: { type: string, nullable: true }
        before: { nullable: true }
        after: { nullable: true }
        ip: { type: string, nullable: true }
        userAgent: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
      required: [id, action, entityType, createdAt]

    AuditLogResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items: { $ref: "#/components/schemas/AuditLogEntry" }
        meta:
          type: object
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
            pages: { type: integer }
          required: [page, limit, total, pages]
      required: [success, data, meta]

    SuccessMessage:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success
        - message

    ApiError:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        pages:
          type: integer

    # AUTH SCHEMAS
    LoginBody:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    PinLoginBody:
      type: object
      required: [username, pin, locationId]
      properties:
        username:
          type: string
        pin:
          type: string
        locationId:
          type: string

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            accessToken:
              type: string
            user:
              $ref: "#/components/schemas/UserProfile"

    RefreshResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            accessToken:
              type: string

    UserProfile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        username:
          type: string
        role:
          type: string
        locationIds:
          type: array
          items:
            type: string
        maxDiscountPct:
          type: number

    # USER SCHEMAS
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        username:
          type: string
