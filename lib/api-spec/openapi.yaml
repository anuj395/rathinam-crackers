        success:
          type: boolean
        data:
          $ref: "#/components/schemas/SiteContent"

    # ============================================================
    # PRODUCT REVIEWS
    # ============================================================
    ProductReview:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        authorName:
          type: string
        city:
          type: string
        rating:
          type: integer
        title:
          type: string
        body:
          type: string
        verified:
          type: boolean
        status:
          type: string
          description: pending | approved | rejected
        createdAt:
          type: string
    SubmitReviewBody:
      type: object
      required: [authorName, rating, body]
      properties:
        authorName:
          type: string
        city:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
        body:
          type: string
    UpdateReviewBody:
      type: object
      properties:
        status:
          type: string
        verified:
          type: boolean
        title:
          type: string
        body:
          type: string
        rating:
          type: integer
    ProductReviewsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProductReview"
        summary:
          type: object
          properties:
            total:
              type: integer
            average:
              type: number
            distribution:
              type: array
              items:
                type: object
                properties:
                  stars:
                    type: integer
                  count:
                    type: integer
                  pct:
                    type: integer
    ProductReviewListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProductReview"
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean

    ShopSignupBody:
      type: object
      required: [name, phone, password]
      properties:
        name: { type: string }
        phone: { type: string }
        email: { type: string }
        password: { type: string, minLength: 6 }

    ShopLoginBody:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: email or phone
        password: { type: string }

    ShopCustomer:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        phone: { type: string }
        email: { type: string, nullable: true }
        loyaltyPoints: { type: integer }
        emailVerified: { type: boolean }

    ShopAuthResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            token: { type: string }
            customer:
              $ref: "#/components/schemas/ShopCustomer"

    ShopMeResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          $ref: "#/components/schemas/ShopCustomer"

    AddressInline:
      type: object
      description: Inline address used on invoices, orders and printed documents.
      required: [name, phone, line1, city, state, pincode]
      properties:
        name: { type: string }
        phone: { type: string }
        line1: { type: string }
        line2: { type: string, nullable: true }
        city: { type: string }
        state: { type: string }
        pincode: { type: string }
        landmark: { type: string, nullable: true }

    ShopAddress:
      type: object
      properties:
        id: { type: string }
        label: { type: string, nullable: true }
        name: { type: string }
        phone: { type: string }
        line1: { type: string }
        line2: { type: string, nullable: true }
        city: { type: string }
        state: { type: string }
        pincode: { type: string }
        landmark: { type: string, nullable: true }
        addressType:
          type: string
          enum: [shipping, billing, both]
          default: both
        isDefault: { type: boolean }

    ShopAddressBody:
      type: object
      required: [name, phone, line1, city, state, pincode]
      properties:
        label: { type: string }
        name: { type: string }
        phone: { type: string }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        state: { type: string }
        pincode: { type: string }
        landmark: { type: string }
        addressType:
          type: string
          enum: [shipping, billing, both]
        isDefault: { type: boolean }

    ShopAddressResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          $ref: "#/components/schemas/ShopAddress"

    ShopAddressList:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items:
            $ref: "#/components/schemas/ShopAddress"

    ShopWishlistItem:
      type: object
      properties:
        customerId: { type: string }
        productId: { type: string }
        createdAt: { type: string, format: date-time }

    ShopWishlistResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items:
            $ref: "#/components/schemas/ShopWishlistItem"

    PlaceShopOrderBody:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [productId, variantId, qty]
            properties:
              productId: { type: string }
              variantId: { type: string }
              qty: { type: integer }
        addressId:
          type: string
          description: Legacy alias for shippingAddressId. Used for shipping if shippingAddressId is omitted.
        shippingAddressId: { type: string }
        billingAddressId:
          type: string
          description: Optional. Defaults to shippingAddressId / addressId when omitted.
        paymentMode:
          type: string
          enum: [COD, UPI, BANK]
        notes: { type: string }

    ShopOrder:
      type: object
      properties:
        id: { type: string }
        invoiceNo: { type: string }
        customerId: { type: string }
        customerName: { type: string }
        items: { type: array, items: { type: object, additionalProperties: true } }
        subtotal: { type: string }
        taxableAmount: { type: string }
        cgst: { type: string }
        sgst: { type: string }
        total: { type: string }
        channel: { type: string }
        status: { type: string }
        logisticsDetails:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }

    ShopOrderResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          $ref: "#/components/schemas/ShopOrder"

    ShopOrderListResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items:
            $ref: "#/components/schemas/ShopOrder"
