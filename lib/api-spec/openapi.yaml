openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: Rathinam Crackers Business Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: products
    description: Product management
  - name: pricing
    description: Pricing and price lists
  - name: stock
    description: Inventory and stock management
  - name: customers
    description: Customer management
  - name: suppliers
    description: Supplier management
  - name: agents
    description: Agent management
  - name: estimates
    description: Estimates and quotations
  - name: invoices
    description: Invoices and billing
  - name: pos
    description: Point of sale
  - name: transfers
    description: Stock transfers
  - name: purchase-orders
    description: Purchase orders
  - name: coupons
    description: Coupons and promotions
  - name: returns
    description: Returns and damage
  - name: reports
    description: Reports and analytics
  - name: notifications
    description: Notification management
  - name: settings
    description: System settings
  - name: users
    description: User management
  - name: locations
    description: Location management
  - name: brands
    description: Brand master (manufacturer brands with logos)
  - name: brochure
    description: Order brochure
  - name: dashboard
    description: Dashboard data
  - name: siteContent
    description: Public website CMS content (homepage, help, FAQs)
  - name: reviews
    description: Product reviews (public submission, admin moderation)
  - name: shop
    description: Public storefront — customer auth, addresses, wishlist, orders
  - name: audit
    description: Immutable audit trail of admin writes

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ============================================================
  # AUTH
  # ============================================================
  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/auth/pin-login:
    post:
      operationId: pinLogin
      tags: [auth]
      summary: Login with PIN (POS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinLoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

  /v1/auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"

  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"

  /v1/auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  # ============================================================
  # DASHBOARD
  # ============================================================
  /v1/dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary widgets
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /v1/dashboard/sales-by-channel:
    get:
      operationId: getSalesByChannel
      tags: [dashboard]
      summary: Get sales grouped by channel (chart data)
      security:
        - bearerAuth: []
      parameters:
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Sales by channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesByChannelResponse"

  /v1/dashboard/top-products:
    get:
      operationId: getTopProducts
      tags: [dashboard]
      summary: Get top selling products
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 5
      responses:
        "200":
          description: Top products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopProductsResponse"

  /v1/dashboard/agent-performance:
    get:
      operationId: getAgentPerformance
      tags: [dashboard]
      summary: Get agent performance this month
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Agent performance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPerformanceResponse"

  /v1/dashboard/by-location:
    get:
      operationId: getDashboardByLocation
      tags: [dashboard]
      summary: Per-location sales, stock and shift metrics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Location metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardByLocationResponse"

  /v1/dashboard/daily-sales:
    get:
      operationId: getDailySales
      tags: [dashboard]
      summary: Daily sales time series for last N days
      security:
        - bearerAuth: []
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 30
        - name: locationId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Daily sales series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailySalesResponse"

  /v1/dashboard/business-overview:
    get:
      operationId: getBusinessOverview
      tags: [dashboard]
      summary: Business-wide KPIs (MTD, YTD, growth, payment mix, top customers, GST)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Business overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessOverviewResponse"

  # ============================================================
  # PRODUCTS
  # ============================================================
  /v1/products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: onlineDisplay
          in: query
          schema:
            type: boolean
        - name: occasion
          in: query
          schema:
            type: string
          description: Filter to products tagged with this occasion key.
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a new product
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBody"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /v1/products/public:
    get:
      operationId: listPublicProducts
      tags: [products]
      summary: List public products (website)
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: featured
          in: query
          schema:
            type: boolean
        - name: occasion
          in: query
          schema:
            type: string
          description: Filter to products tagged with this occasion key.
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Public product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"

  /v1/products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    put:
      operationId: updateProduct
      tags: [products]
      summary: Update product
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductBody"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Discontinue product
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product discontinued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"

  /v1/products/{id}/price:
    get:
      operationId: resolveProductPrice
      tags: [products]
      summary: Resolve price for a product variant
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: variantId
          in: query
          required: true
          schema:
            type: string
        - name: qty
          in: query
          required: true
          schema:
            type: integer
        - name: customerId
          in: query
          schema:
            type: string
        - name: channel
          in: query
          required: true
          schema:
            type: string
        - name: priceListId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Resolved price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceResolution"

  # ============================================================
  # PRICE LISTS
  # ============================================================
  /v1/price-lists:
    get:
      operationId: listPriceLists
      tags: [pricing]
      summary: List price lists
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Price lists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceListsResponse"
    post:
      operationId: createPriceList
      tags: [pricing]
      summary: Create price list
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePriceListBody"
      responses:
        "201":
          description: Price list created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceList"

  # ============================================================
  # STOCK
  # ============================================================
  /v1/stock/levels:
    get:
      operationId: getStockLevels
      tags: [stock]
      summary: Get stock levels
      security:
        - bearerAuth: []
      parameters:
        - name: locationId
          in: query
          schema:
            type: string
        - name: productId
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: lowStockOnly
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Stock levels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockLevelsResponse"

  /v1/stock/ledger:
    get:
      operationId: getStockLedger
      tags: [stock]
      summary: Get stock ledger entries
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: query
          schema:
            type: string
        - name: locationId
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Ledger entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockLedgerResponse"

  /v1/stock/receive:
    post:
      operationId: receiveStock
      tags: [stock]
      summary: Receive stock (goods inward)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiveStockBody"
      responses:
        "200":
          description: Stock received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiveStockResponse"

  /v1/stock/adjust:
    post:
      operationId: adjustStock
      tags: [stock]
      summary: Adjust stock manually
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustStockBody"
      responses:
        "200":
          description: Stock adjusted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"

  # ============================================================
  # CUSTOMERS
  # ============================================================
  /v1/customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List customers
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: customerType
          in: query
          schema:
            type: string
        - name: agentId
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Customer list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerListResponse"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create customer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerBody"
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /v1/customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get customer by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    put:
      operationId: updateCustomer
      tags: [customers]
      summary: Update customer
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerBody"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /v1/customers/{id}/statement:
    get:
      operationId: getCustomerStatement
      tags: [customers]
      summary: Get customer credit statement
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Credit statement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerStatementResponse"

  /v1/customers/{id}/loyalty:
    get:
      operationId: getCustomerLoyalty
      tags: [customers]
      summary: Get customer loyalty points
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Loyalty points
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoyaltyResponse"

  /v1/customers/{id}/payment:
    post:
      operationId: recordCustomerPayment
      tags: [customers]
      summary: Record customer payment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordPaymentBody"
      responses:
        "200":
          description: Payment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"

  # ============================================================
  # SUPPLIERS
  # ============================================================
  /v1/suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      summary: List suppliers
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Supplier list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierListResponse"
    post:
      operationId: createSupplier
      tags: [suppliers]
      summary: Create supplier
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupplierBody"
      responses:
        "201":
          description: Supplier created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"

  /v1/suppliers/{id}:
    get:
      operationId: getSupplier
      tags: [suppliers]
      summary: Get supplier by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
    put:
      operationId: updateSupplier
      tags: [suppliers]
      summary: Update supplier
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSupplierBody"
      responses:
        "200":
          description: Updated supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"

  # ============================================================
  # AGENTS
  # ============================================================
  /v1/agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List agents
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentListResponse"
    post:
      operationId: createAgent
      tags: [agents]
      summary: Create agent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentBody"
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /v1/agents/{id}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: Get agent by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
    put:
      operationId: updateAgent
      tags: [agents]
      summary: Update agent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentBody"
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /v1/agents/{id}/commission:
    get:
      operationId: getAgentCommission
      tags: [agents]
      summary: Get agent commission report
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Commission report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionResponse"

  # ============================================================
  # ESTIMATES
  # ============================================================
  /v1/estimates:
    get:
      operationId: listEstimates
      tags: [estimates]
      summary: List estimates
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: customerId
          in: query
          schema:
            type: string
        - name: agentId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Estimate list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimateListResponse"
    post:
      operationId: createEstimate
      tags: [estimates]
      summary: Create estimate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEstimateBody"
      responses:
        "201":
          description: Estimate created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"

  /v1/estimates/{id}:
    get:
      operationId: getEstimate
      tags: [estimates]
      summary: Get estimate by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Estimate
          content:
            application/json:
